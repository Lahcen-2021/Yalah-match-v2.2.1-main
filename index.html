<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>يلا ماتش | مباريات اليوم بث مباشر - Yalla Match</title>
    <meta name="description" content="يلا ماتش (Yalla Match) يقدم لك جدول مباريات اليوم، القنوات الناقلة، البث المباشر، ونتائج المباريات للدوريات العالمية والمحلية. تابع كورة لايف عبر yallamatch.online." />
    <meta name="keywords" content="يلا ماتش, yalla match, يلا شوت, yalla shoot, كورة لايف, kora live, koora live, فابور تي في, fabor tv, يلا كورة, yalla kora, كووورة, kooora, مباريات اليوم, بث مباشر, كورة, يلاماتش, جدول المباريات, القنوات الناقلة, الدوري السعودي, الدوري الانجليزي, دوري ابطال اوروبا, بث مباشر مباريات اليوم, مشاهدة المباريات" />
    <meta name="author" content="Yalla Match" />
    <meta name="robots" content="index, follow" />
    <!-- Apex host, trailing slash, matching og:url/twitter:url below. NOT www:
         www.yallamatch.online returns Cloudflare 526 (the origin-pull fails cert
         validation for that hostname), so a canonical pointing there sends crawlers
         to a URL that does not resolve. WordPress's home_url() is the apex too. -->
    <link rel="canonical" href="https://yallamatch.online/" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_MA" />
    <meta property="og:site_name" content="يلا ماتش - Yalla Match" />
    <meta property="og:url" content="https://yallamatch.online/" />
    <meta property="og:title" content="يلا ماتش | مباريات اليوم بث مباشر" />
    <meta property="og:description" content="تابع أهم مباريات اليوم بث مباشر ونتائج حية على يلا ماتش. المصدر الأول لأخبار الكرة العربية والعالمية." />
    <!-- og-image.jpg: 1200x630 export of the hero artwork (see public/hero.webp) -->
    <meta property="og:image" content="https://yallamatch.online/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yallamatch.online/" />
    <meta property="twitter:title" content="يلا ماتش | مباريات اليوم بث مباشر" />
    <meta property="twitter:description" content="تابع أهم مباريات اليوم بث مباشر ونتائج حية على يلا ماتش." />
    <meta property="twitter:image" content="https://yallamatch.online/og-image.jpg" />

    <!-- Structured data: helps Google show the site name, search box and org logo -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://yallamatch.online/#website",
          "url": "https://yallamatch.online/",
          "name": "يلا ماتش - Yalla Match",
          "alternateName": ["Yalla Match", "يلاماتش"],
          "description": "جدول مباريات اليوم، القنوات الناقلة، النتائج المباشرة، ترتيب الدوريات وأخبار كرة القدم",
          "inLanguage": "ar"
        },
        {
          "@type": "Organization",
          "@id": "https://yallamatch.online/#organization",
          "name": "Yalla Match",
          "url": "https://yallamatch.online/",
          "logo": "https://cdn-icons-png.flaticon.com/128/53/53283.png"
        }
      ]
    }
    </script>

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/53/53283.png" type="image/png" />
    
    <!-- Performance Optimizations: Preconnect to important origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://wsrv.nl">
    <link rel="preconnect" href="https://imagecache.365scores.com">
    <link rel="dns-prefetch" href="https://imagecache.365scores.com">

    <!--
      Note: we intentionally do NOT <link rel="preload"> a specific Tajawal .woff2 file.
      Google Fonts serves hashed filenames that rotate over time, so a pinned URL 404s and
      triggers a "preloaded but not used" warning. The font is delivered by the Google Fonts
      stylesheet below, and the fonts.gstatic.com preconnect above already warms the connection.
    -->

    <!--
      hls.js, video.js and video-js.css are loaded on demand by components/Players.tsx the first
      time a stream player mounts (see loadVideoLibs()) instead of eagerly here — they are ~540 KB
      that the match list never needs, so keeping them off the initial load speeds up first paint.
    -->

    <!--
      Plain stylesheet link, deliberately. This used to be the `media="print"
      onload="this.media='all'"` async-CSS trick, which is an INLINE EVENT HANDLER — and
      the production CSP (netlify.toml / the WordPress theme's functions.php) ships
      script-src without 'unsafe-inline'. The browser blocked the onload, `media` stayed
      "print", and the Cairo/Tajawal stylesheet never applied: the live site rendered in a
      fallback font while looking correct in dev, where no CSP is set.
      `display=swap` already keeps text visible while the font loads, and the
      fonts.googleapis/gstatic preconnects above cover the connection cost.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
