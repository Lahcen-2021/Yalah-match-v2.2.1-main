    <path d="M800 900C920 640 1220 640 1400 420 1560 220 1790 165 2000 205"/>
    <path d="M840 900C960 660 1260 660 1440 440 1600 240 1820 190 2000 230"/>
    <path d="M880 900C1000 680 1300 680 1480 460 1640 260 1850 215 2000 255"/>
    <path d="M920 900C1040 700 1340 700 1520 480 1680 280 1880 240 2000 280"/>
    <path d="M960 900C1080 720 1380 720 1560 500 1720 300 1910 265 2000 305"/>
    <path d="M1000 900C1120 740 1420 740 1600 520 1760 320 1940 290 2000 330"/>
