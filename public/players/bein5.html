<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
<video id="tv" controls autoplay playsinline style="width:100%;height:100%"></video>
<script>
(function(){
  var v=document.getElementById("tv"),u="https://stream.goalxtv.workers.dev/b5/fhd.m3u8";
  function load(){
    if(Hls.isSupported()){
      var h=new Hls({maxBufferLength:60,liveSyncDurationCount:3,
        manifestLoadingMaxRetry:8,fragLoadingMaxRetry:8});
      h.loadSource(u);h.attachMedia(v);
      h.on(Hls.Events.MANIFEST_PARSED,function(){v.play();});
      h.on(Hls.Events.ERROR,function(e,d){if(d.fatal)setTimeout(load,3000);});
      setInterval(function(){if(v.paused&&!v.ended)v.play();},8000);
    }else if(v.canPlayType("application/vnd.apple.mpegurl")){
      v.src=u;v.play();
    }
  }
  load();
})();
</script>
