<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beIN Sports 1 - HD</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; background: #000; object-fit: contain; }
    </style>
</head>
<body>
    <video id="tv" controls autoplay playsinline></video>
    <script>
    (function(){
      var v=document.getElementById("tv"),u="https://stream.goalxtv.workers.dev/b1/fhd.m3u8";
      function load(){
        if(Hls.isSupported()){
          var h=new Hls({
            maxBufferLength:60,
            liveSyncDurationCount:3,
            manifestLoadingMaxRetry:8,
            fragLoadingMaxRetry:8
          });
          h.loadSource(u);
          h.attachMedia(v);
          h.on(Hls.Events.MANIFEST_PARSED,function(){v.play();});
          h.on(Hls.Events.ERROR,function(e,d){if(d.fatal)setTimeout(load,3000);});
          setInterval(function(){if(v.paused&&!v.ended)v.play();},8000);
        }else if(v.canPlayType("application/vnd.apple.mpegurl")){
          v.src=u;v.play();
        }
      }
      load();
    })();
    </script>
</body>
</html>
